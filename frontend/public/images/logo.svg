<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Degradados dorados de lujo -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Circular Principal con relieve -->
  <circle cx="250" cy="250" r="235" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
  
  <!-- Anillo Decorativo con Guiones Finos -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 6"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Rayos solares / Sol andino de fondo sutil -->
  <g opacity="0.18" stroke="url(#goldLight)" stroke-width="2">
    <line x1="250" y1="40" x2="250" y2="70" />
    <line x1="250" y1="430" x2="250" y2="460" />
    <line x1="40" y1="250" x2="70" y2="250" />
    <line x1="430" y1="250" x2="460" y2="250" />
    <line x1="102" y1="102" x2="125" y2="125" />
    <line x1="398" y1="398" x2="375" y2="375" />
    <line x1="102" y1="398" x2="125" y2="375" />
    <line x1="398" y1="102" x2="375" y2="125" />
  </g>

  <!-- Llama de la Sazón Peruana en el fondo central -->
  <g transform="translate(250, 155) scale(0.75)" filter="url(#glow)">
    <path d="M0,45 C-18,25 -25,-10 -5,-35 C2,-43 10,-48 12,-55 C16,-40 28,-30 28,-10 C28,15 15,35 0,45 Z" fill="url(#flameGrad)" opacity="0.8"/>
    <path d="M0,40 C-10,25 -14,0 -2,-18 C2,-24 8,-28 9,-32 C12,-22 18,-15 18, -3 C18,12 8,28 0,40 Z" fill="#FEF08A" opacity="0.9"/>
  </g>

  <!-- Gorro de Chef / Corona Gastronómica -->
  <g transform="translate(250, 138) scale(0.85)">
    <!-- Base del gorro -->
    <path d="M -38,20 L 38,20 L 32,32 L -32,32 Z" fill="url(#goldGrad)" />
    <rect x="-35" y="16" width="70" height="4" rx="2" fill="url(#goldLight)" />
    <!-- Pliegues del gorro -->
    <path d="M -35,16 C -50,5 -52,-25 -32,-35 C -25,-40 -12,-42 0,-45 C 12,-42 25,-40 32,-35 C 52,-25 50,5 35,16 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M -20,16 C -30,5 -30,-25 -15,-38 C -10,-42 0,-44 0,-45 C 0,-44 10,-42 15,-38 C 30,-25 30,5 20,16 Z" fill="url(#goldLight)" opacity="0.6"/>
  </g>

  <!-- Cubiertos Cruzados de Alta Gastronomía (Tenedor y Cuchara Dorados) -->
  <g transform="translate(250, 215) scale(0.95)" filter="url(#shadow)">
    <!-- Cuchara inclinada izquierda a derecha -->
    <g transform="rotate(-32)">
      <!-- Mango -->
      <path d="M -4,65 L -3,-20 C -3,-28 -6,-35 -6,-45 C -6,-58 6,-58 6,-45 C 6,-35 3,-28 3,-20 L 4,65 C 4,70 1,73 0,73 C -1,73 -4,70 -4,65 Z" fill="url(#goldGrad)"/>
      <!-- Óvalo de cuchara -->
      <ellipse cx="0" cy="-52" rx="14" ry="22" fill="url(#goldLight)"/>
      <ellipse cx="0" cy="-52" rx="11" ry="18" fill="url(#goldGrad)"/>
    </g>
    <!-- Tenedor inclinado derecha a izquierda -->
    <g transform="rotate(32)">
      <!-- Mango -->
      <path d="M -4,65 L -3,-15 C -3,-22 -7,-30 -7,-38 L 7,-38 C 7,-30 3,-22 3,-15 L 4,65 C 4,70 1,73 0,73 C -1,73 -4,70 -4,65 Z" fill="url(#goldGrad)"/>
      <!-- Base tenedor -->
      <path d="M -9,-38 C -9,-48 -4,-54 0,-55 C 4,-54 9,-48 9,-38 Z" fill="url(#goldGrad)"/>
      <!-- Dientes del tenedor -->
      <line x1="-7" y1="-44" x2="-7" y2="-72" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-2.3" y1="-44" x2="-2.3" y2="-74" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="2.3" y1="-44" x2="2.3" y2="-74" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="7" y1="-44" x2="7" y2="-72" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Broche central con gema de sol -->
    <circle cx="0" cy="0" r="10" fill="url(#goldLight)" stroke="#78350F" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#D97706"/>
    <circle cx="0" cy="0" r="3" fill="#FEF08A"/>
  </g>

  <!-- Plato / Cazuela Tradicional que enmarca la base -->
  <ellipse cx="250" cy="275" rx="60" ry="10" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Placa / Cinta con degradado para el nombre -->
  <g filter="url(#shadow)">
    <!-- Cinta curvada estilizada de fondo -->
    <path d="M 60,330 C 130,312 370,312 440,330 L 430,378 C 365,360 135,360 70,378 Z" fill="#0F0F12" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M 65,335 C 132,318 368,318 435,335 L 427,372 C 363,355 137,355 73,372 Z" fill="none" stroke="url(#goldLight)" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Remates de cinta en los extremos -->
    <polygon points="50,345 65,325 65,375 50,360" fill="url(#goldGrad)"/>
    <polygon points="450,345 435,325 435,375 450,360" fill="url(#goldGrad)"/>
  </g>

  <!-- TEXTO PRINCIPAL: SABOR CHUGURANO -->
  <!-- Curva guía oculta para el texto curvado si es necesario o texto con estilo -->
  <text x="250" y="357" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="900" font-size="31" fill="url(#goldLight)" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">
    SABOR CHUGURANO
  </text>

  <!-- Subtítulo / Lema -->
  <g transform="translate(250, 400)">
    <line x1="-120" y1="-8" x2="-65" y2="-8" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Estrellas de calidad culinaria -->
    <path d="M -50,-8 L -48,-14 L -43,-14 L -47,-10 L -45,-4 L -50,-8 Z" fill="url(#goldLight)" transform="scale(0.8) translate(-10,-2)"/>
    <path d="M 0,-14 L 3,-6 L 11,-6 L 5,-1 L 7,7 L 0,2 L -7,7 L -5,-1 L -11,-6 L -3,-6 Z" fill="url(#goldLight)" transform="scale(0.9) translate(0,-8)"/>
    <path d="M 50,-8 L 48,-14 L 43,-14 L 47,-10 L 45,-4 L 50,-8 Z" fill="url(#goldLight)" transform="scale(0.8) translate(10,-2)"/>
    <line x1="65" y1="-8" x2="120" y2="-8" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <text x="0" y="10" font-family="'Montserrat', 'Helvetica', sans-serif" font-weight="800" font-size="11" fill="#E4E4E7" text-anchor="middle" letter-spacing="3.5">
      MENÚ &amp; PLATOS A LA CARTA
    </text>
    <text x="0" y="24" font-family="'Montserrat', 'Helvetica', sans-serif" font-weight="600" font-size="9" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2.5">
      TRADICIÓN &amp; SAZÓN PERUANA
    </text>
  </g>
</svg>

