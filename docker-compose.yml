version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: casita_nortena_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: casita_nortena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database:/docker-entrypoint-initdb.d

volumes:
  pgdata:
